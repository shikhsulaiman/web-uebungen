<!DOCTYPE html>
<html>
    <head>
    <title>iFrames</title>
    </head>
    <body>
       <h1>iFrames</h1>
        <h3>Wikipedia-Artikel</h3>
        <iframe width="400px" height="300px" style="border: none" src="https://de.wikipedia.org/wiki/Inlineframe"></iframe>
        
        <iframe width="400px" height="300px" name="iframeA"></iframe>
        <p><a href="https://de.wikipedia.org/wiki/Inlineframe" target="iframeA">Wikpedia</a> </p>
        
        <h3>Youtube-Videos einbetten</h3>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/FE1CqL7Fbsg" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        
        <iframe width="560" height="315" src="https://web.de/magazine/panorama/videos/lastwagen-a3-flamme-fahrer-retten-42096838" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <!-- Vimeo pro account required -->
        <iframe src="https://player.vimeo.com/video/131188216?api=1" width="500" height="281" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
    </body>
</html>
