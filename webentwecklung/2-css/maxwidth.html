<!DOCTYPE html>
<html>
    <head>
        <title>Max-width</title>
        <style>
            div.festebreite {
                width: 60%;
                margin: auto;
                border: 3px solid red;
            }
            div.flexiblebreite {
                max-width: 80%;
                margin: auto;
                border: 3px solid red;
            }
        </style>
    </head>
    <body>
        <h1>Max-width</h1>
        <div class="festebreite">Die Elementa hat eine feste Bereite</div>
        <div class="flexiblebreite">Die Elementa hat eine flexible Bereite</div>
    </body>
</html>
