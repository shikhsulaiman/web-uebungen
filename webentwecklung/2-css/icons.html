<!DOCTYPE html>
<html>
    <head>
        <title>Icons</title>
        <!-- Stylesheet -->
        <link rel="stylesheet" type="text/css" href="icons.css">
        
        <!-- Icons -->
       
        <link rel="stylesheet" href="https://googleapis.com" />
        
        <!-- loads the entire Variable Font -->
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,home,search,settings" rel="stylesheet" />
    </head>
    <body>
        <h1>Icons</h1>
        <span class="fas fa-camera-retro">
        </span>
        <i class="fa-solid fa-face-smile"></i>
        
        
        <!-- thin outlined icons -->
        <div style="font-variation-settings: 'FILL' 0, 'wght' 100, 'GRAD' 0, 'opsz' 48;">
          <span class="material-symbols-outlined">search</span>
          <span class="material-symbols-outlined">home</span>
          <span class="material-symbols-outlined">settings</span>
          <span class="material-symbols-outlined">favorite</span>
        </div>

        <!-- thick filled icons -->
        <div style="font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;">
          <span class="material-symbols-outlined">search</span>
          <span class="material-symbols-outlined">home</span>
          <span class="material-symbols-outlined">settings</span>
          <span class="material-symbols-outlined">favorite</span>
        </div>
        
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=favorite,home,search,settings" rel="stylesheet" />

        <div>
          <span class="material-symbols-outlined size-20">favorite</span>
          <span class="material-symbols-outlined size-24">favorite</span>
          <span class="material-symbols-outlined size-40">favorite</span>
          <span class="material-symbols-outlined size-48">favorite</span>
        </div>

        <div>
          <span class="material-symbols-outlined dark">favorite</span>
          <span class="material-symbols-outlined dark-inactive">favorite</span>
        </div>
    </body>
</html>
