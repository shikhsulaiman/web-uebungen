<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Todos-Liste</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Meine Liste</h1>

      <div class="eingabeZeile">
        <input type="text" id="eingabe" placeholder="Name eingeben" />
        <button id="hinzuButton">Hinzufügen</button>
      </div>

      <button id="alleLoeschen">Alle löschen</button>
      <button id="exportButton">Als Datei speichern</button>

      <ul id="liste"></ul>
    </div>

    <script>
      const eingabe = document.querySelector("#eingabe");
      const hinzuButton = document.querySelector("#hinzuButton");
      const alleLoeschen = document.querySelector("#alleLoeschen");
      const liste = document.querySelector("#liste");
      const exportButton = document.querySelector("#exportButton");

      let todos = JSON.parse(localStorage.getItem("todos")) || [];

      exportButton.addEventListener("click", function () {
        const text = JSON.stringify(todos, null, 2); // schön formatiert
        const blob = new Blob([text], { type: "application/json" });
        const url = URL.createObjectURL(blob); // Download-URL

        const link = document.createElement("a");
        link.href = url;
        link.download = "todos.json";

        link.click();

        URL.revokeObjectURL(url); // Aufräumen
      });

      function speichern() {
        localStorage.setItem("todos", JSON.stringify(todos));
      }

      function anzeigen() {
        liste.innerHTML = "";
        todos.forEach(function (todo, index) {
          const li = document.createElement("li");

          // Text in eigenes span (damit das li nicht ALLES als Text hat)
          const textSpan = document.createElement("span");
          textSpan.textContent = todo.text;
          li.appendChild(textSpan);

          if (todo.erledigt) {
            textSpan.style.textDecoration = "line-through";
            textSpan.style.opacity = "0.5";
          }

          li.addEventListener("click", function () {
            todos[index].erledigt = !todos[index].erledigt;
            speichern();
            anzeigen();
          });

          // Container für Buttons
          const actions = document.createElement("div");
          actions.className = "actions";

          // Bearbeiten
          const editButton = document.createElement("button");
          editButton.textContent = "✏️";
          editButton.addEventListener("click", function (event) {
            event.stopPropagation();
            const neuerText = prompt("Neuer Text:", todo.text);
            if (neuerText) {
              todos[index].text = neuerText;
              speichern();
              anzeigen();
            }
          });

          // Nach oben
          const upButton = document.createElement("button");
          upButton.textContent = "⬆️";
          upButton.addEventListener("click", function (event) {
            event.stopPropagation();
            if (index > 0) {
              [todos[index - 1], todos[index]] = [
                todos[index],
                todos[index - 1],
              ];
              speichern();
              anzeigen();
            }
          });

          // Löschen
          const xButton = document.createElement("button");
          xButton.textContent = "❌";
          xButton.addEventListener("click", function (event) {
            event.stopPropagation();
            todos.splice(index, 1);
            speichern();
            anzeigen();
          });

          actions.appendChild(editButton);
          actions.appendChild(upButton);
          actions.appendChild(xButton);
          li.appendChild(actions);

          liste.appendChild(li);
        });
      }

      function hinzufuegen() {
        const name = eingabe.value;
        if (name === "") return;
        todos.push({ text: name, erledigt: false });
        speichern();
        eingabe.value = "";
        anzeigen();
      }

      hinzuButton.addEventListener("click", hinzufuegen);
      eingabe.addEventListener("keydown", function (event) {
        if (event.key === "Enter") hinzufuegen();
      });

      alleLoeschen.addEventListener("click", function () {
        todos = [];
        speichern();
        anzeigen();
      });

      anzeigen();
    </script>
  </body>
</html>
