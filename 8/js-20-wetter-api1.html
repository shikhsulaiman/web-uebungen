<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Wetter</title>
  </head>
  <body>
    <h1>Wetter in Frankfurt</h1>
    <p id="anzeige">Lädt...</p>

    <script>
      const anzeige = document.querySelector("#anzeige");

      const url =
        "https://api.open-meteo.com/v1/forecast?latitude=50.11&longitude=8.68&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code";

      fetch(url)
        .then(function (response) {
          return response.json();
        })
        .then(function (daten) {
          console.log(daten);

          const temperatur = daten.current.temperature_2m;
          const luftfeuchte = daten.current.relative_humidity_2m;
          const wind = daten.current.wind_speed_10m;
          const code = daten.current.weather_code;

          anzeige.innerHTML = `
           🌡️ Temperatur: ${temperatur} °C<br>
           💧 Luftfeuchte: ${luftfeuchte} %<br>
           💨 Wind: ${wind} km/h<br>
           ☁️ Wetter-Code: ${code}
          `;
        });
    </script>
  </body>
</html>
