<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <title>JavScrit</title>
    </head>
    <body>
        <h1>Hallo!</h1>
        <button id="meinButton">Klick mich</button>

        <script>
            let button = document.querySelector("#meinButton");

            function begruessen() {
                alert("Hallo Mohamed! Dein Javascript funktioniert! 🎉");
            }

            button.addEventListener("click", begruessen);

            const ueberschrift = document.querySelector("h1");

            ueberschrift.textContent = "Neuer Text!";
            



        </script>
    </body>
</html>
