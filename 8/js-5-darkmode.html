<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Drk Mode</title>
    <style>
      body {
        background: white;
        color: black;
        transition: 0.3s;
      }
      body.dark {
        background: #222;
        color: white;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #222;
          color: white;
        }
      }
    </style>
  </head>
  <body>
    <h1>Hallo!</h1>
    <button id="toggleButton">Dark Mode</button>

    <script>
      const toggleButton = document.querySelector("#toggleButton");

      function darkMode() {
        document.body.classList.toggle("dark");

        if (document.body.classList.contains("dark")) {
          toggleButton.textContent = "Light Mode";
        } else {
          toggleButton.textContent = "Dark Mode";
        }
      }

      toggleButton.addEventListener("click", darkMode);
    </script>
  </body>
</html>
